default_language_version:
    python:
        request: '>= 3.12'
        preference: managed

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: check-json
      - id: check-yaml
      - id: check-toml

  - repo: https://github.com/tombi-toml/tombi-pre-commit
    rev: v1.9.7
    hooks:
      - id: tombi-lint
        args: ["--offline"]
      - id: tombi-format
        args: ["--offline"]

  - repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args:
          # https://github.com/astral-sh/ruff-pre-commit/issues/64
          - '--fix'
          - '--unsafe-fixes'
      - id: ruff-format

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.6
    hooks:
      - id: uv-lock
      - id: uv-export
        args:
          - '-o'
          - 'requirements.txt'
          - '--no-hashes'
